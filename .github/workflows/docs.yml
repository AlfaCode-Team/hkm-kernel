name: Docs

# Builds the documentation site in website/ and publishes it to GitHub Pages.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
# The site is served at https://alfacode-team.github.io/hkm-kernel/ — hence
# DOCS_BASE. With a custom domain, set DOCS_BASE to "/" (or drop the line).
"on":
  push:
    branches: [main]
    paths:
      - "website/**"
      - "CHANGELOG.md"          # included verbatim by website/reference/changelog.md
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      # Fails on any dead internal link (ignoreDeadLinks: false).
      - run: npm run build
        env:
          DOCS_BASE: /hkm-kernel/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
