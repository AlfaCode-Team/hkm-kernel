name: Release

# Two ways in:
#   1. push a `v*` tag        → VERSION comes from the tag name.
#   2. workflow_call (version) → VERSION comes from the caller (auto-release.yml),
#                                so no PAT is needed to chain from a merge to main.
"on":
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      version:
        description: "Release version without the leading v (e.g. 1.0.12)"
        required: true
        type: string

permissions:
  contents: write

# Single source of truth for bundling is tools/bundle.sh. Each job sets up the
# toolchain, then calls the script for its OS target. VERSION comes from the tag
# (push) or the workflow_call input.
env:
  ZIG_VERSION: "0.17.0-dev.657+2faf8debf"
  # Resolved version for every job: the input when called, else the tag name.
  RELEASE_VERSION: ${{ inputs.version || '' }}

jobs:
  # ── Gate: run the PHPUnit suite. Nothing builds or publishes unless GREEN. ──
  test:
    name: Test (PHPUnit)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive }   # path-repo modules must be present
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer
          extensions: mbstring, curl, pdo, pdo_sqlite, openssl, fileinfo, zip
      - name: Install dependencies (with dev)
        run: composer install --no-interaction --no-progress
      - name: Run test suite
        run: vendor/bin/phpunit --no-coverage

  # Every bundle is built on Linux — Zig cross-compiles all targets, and the
  # macOS universal binary is assembled with llvm-lipo. This needs only ONE
  # self-hosted Zig toolchain (Linux) and no macOS runner.

  # ── Linux: portable tarball (default install) + .deb (system-wide) ────────
  build-linux:
    name: Build Linux tarball + .deb
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive }
      - name: Setup Zig
        run: ./tools/ci/setup-zig.sh
        env: { ZIG_DIST_URL: "${{ vars.ZIG_DIST_URL }}" }
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.4", tools: composer }
      - name: Bundle (linux)
        run: VERSION="${RELEASE_VERSION:-${GITHUB_REF_NAME#v}}" ./tools/bundle.sh linux
      # TWO artifacts. The tarball is the DEFAULT install path — user-local,
      # no root (tools/install.sh). The .deb is for multi-user machines and CI
      # images where a system-wide install and apt-managed PHP are the point.
      - uses: actions/upload-artifact@v7
        with: { name: linux-tarball, path: dist/*linux*.tar.gz }
      - uses: actions/upload-artifact@v7
        with: { name: linux-deb, path: dist/*.deb }
      # Published alongside the assets so `curl | sh` works without a checkout.
      - uses: actions/upload-artifact@v7
        with: { name: installer, path: tools/install.sh }

  # ── Windows: .zip (x86_64, cross-compiled) ────────────────────────────────
  build-windows:
    name: Build Windows .zip
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive }
      - name: Setup Zig
        run: ./tools/ci/setup-zig.sh
        env: { ZIG_DIST_URL: "${{ vars.ZIG_DIST_URL }}" }
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.4", tools: composer }
      - name: Bundle (windows)
        run: VERSION="${RELEASE_VERSION:-${GITHUB_REF_NAME#v}}" ./tools/bundle.sh windows
      - uses: actions/upload-artifact@v7
        with: { name: windows-zip, path: dist/*.zip }

  # ── macOS: universal .app tarball (arm64 + x86_64), built ON LINUX ─────────
  build-macos:
    name: Build macOS .app
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive }
      - name: Install llvm-lipo (for the universal Mach-O)
        run: sudo apt-get update && sudo apt-get install -y llvm
      - name: Setup Zig
        run: ./tools/ci/setup-zig.sh
        env: { ZIG_DIST_URL: "${{ vars.ZIG_DIST_URL }}" }
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.4", tools: composer }
      - name: Bundle (macos)
        run: VERSION="${RELEASE_VERSION:-${GITHUB_REF_NAME#v}}" ./tools/bundle.sh macos
      - uses: actions/upload-artifact@v7
        with: { name: macos-app, path: dist/*.tar.gz }
      # Published alongside the assets so `curl | sh` works without a checkout
      # — same reasoning as the Linux `installer` artifact below.
      - uses: actions/upload-artifact@v7
        with: { name: macos-installer, path: tools/install-macos.sh }

  # ── Publish GitHub Release with all artifacts ─────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7      # need CHANGELOG.md at the checked-out commit
      - uses: actions/download-artifact@v8
        with: { path: artifacts/ }
      - name: Resolve version + extract CHANGELOG section
        id: notes
        run: |
          VERSION="${RELEASE_VERSION:-${GITHUB_REF_NAME#v}}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Pull the block between "## [VERSION]" and the next "## [" heading.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {grab=1; next}
            grab && /^## \[/ {exit}
            grab {print}
          ' CHANGELOG.md > release-body.md
          if [ -s release-body.md ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No CHANGELOG entry for $VERSION — using auto-generated notes only."
          fi
      - uses: softprops/action-gh-release@v3
        with:
          # When called from auto-release the ref is a branch, so name the tag
          # explicitly; on a tag push this matches GITHUB_REF_NAME anyway.
          tag_name: v${{ steps.notes.outputs.version }}
          files: |
            artifacts/linux-tarball/*.tar.gz
            artifacts/linux-deb/*.deb
            artifacts/windows-zip/*.zip
            artifacts/macos-app/*.tar.gz
            artifacts/installer/install.sh
            artifacts/macos-installer/install-macos.sh
          # Curated section (if present) goes first; GitHub appends the
          # auto-generated "What's Changed" / contributors below it.
          body_path: ${{ steps.notes.outputs.has_notes == 'true' && 'release-body.md' || '' }}
          generate_release_notes: true
          # Created as a DRAFT, then published by the step below.
          #
          # This repository has immutable releases enabled, which forbid
          # attaching assets after a release is published. Publishing first and
          # uploading second produced a release with NO binaries on it and no
          # way to add them — the artifacts built fine and simply had nowhere to
          # go. Assets must land while the release is still a draft.
          draft: true
          prerelease: ${{ contains(steps.notes.outputs.version, '-') }}
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v${{ steps.notes.outputs.version }}" --draft=false --repo "$GITHUB_REPOSITORY"

  # ── Homebrew: repoint the tap formula at the release just published ───────
  #
  # This repository doubles as its own Homebrew tap (HomebrewFormula/hkm.rb), so
  # the formula pins an exact tarball by sha256 — which is only knowable AFTER
  # the asset exists. That is why this is a separate job committing back to main
  # rather than something baked into the release commit.
  #
  # It deliberately re-downloads the PUBLISHED asset instead of reusing the
  # build artifact: identical bytes either way, but this also proves the asset
  # actually landed on the release and is fetchable at the URL the formula
  # hands to Homebrew.
  #
  # HOW THE COMMIT LANDS
  # --------------------
  # Straight to main when the token is allowed to, otherwise as a pull request.
  # Both are needed: `main` here requires reviews, so a bare `git push` is
  # rejected and the formula would sit on a placeholder digest that `brew
  # install` refuses — a silent-until-someone-tries-it failure. The PR fallback
  # keeps the bump from being lost; granting the Actions bot a branch-protection
  # bypass (or using a PAT) is what makes it fully hands-off.
  #
  # Never fails the workflow: the release is already published by this point, so
  # a failure here would misreport a good release as broken. That means BOTH
  # blocked paths — the push and the PR — have to degrade to a warning, since
  # each is refused by a different repo setting.
  homebrew:
    name: Bump Homebrew formula
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The formula lives on main; a tag push checks out the tag by default.
      - uses: actions/checkout@v7
        with: { ref: main }

      - name: Repoint HomebrewFormula/hkm.rb
        run: |
          VERSION="${RELEASE_VERSION:-${GITHUB_REF_NAME#v}}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # The release is published one step before this job starts; allow a
          # few seconds for the asset URL to become fetchable.
          for attempt in 1 2 3 4 5; do
            if ./tools/homebrew-bump.sh "$VERSION"; then exit 0; fi
            echo "attempt $attempt failed — retrying in 15s"
            sleep 15
          done
          echo "::error::could not pin the formula to v$VERSION"
          exit 1

      - name: Commit the bump
        id: commit
        run: |
          if git diff --quiet -- HomebrewFormula/hkm.rb; then
            echo "Formula already points at v$VERSION — nothing to commit."
            echo "landed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HomebrewFormula/hkm.rb
          git commit -m "chore(homebrew): point the formula at v$VERSION"

          # main can move while the release builds. The formula is the only file
          # touched, so rebasing makes the push a fast-forward; if that cannot be
          # done cleanly, leave the commit where it is and let the PR path carry it.
          git fetch --quiet origin main
          git rebase origin/main || git rebase --abort || true

          if git push origin HEAD:main; then
            echo "landed=true" >> "$GITHUB_OUTPUT"
          else
            echo "landed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::could not push to main (branch protection?) — opening a pull request instead"
          fi

      - name: Open a pull request instead
        if: steps.commit.outputs.landed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="homebrew/bump-v$VERSION"
          git push --force origin "HEAD:refs/heads/$BRANCH"
          # A re-run of the same release updates that branch rather than opening
          # a second pull request for the same bump.
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "::notice::updated the existing formula bump PR for v$VERSION"
            exit 0
          fi

          # Heredoc, not an inline --body: a multi-line string inside this YAML
          # block scalar keeps its indentation, which lands verbatim in the PR.
          cat > pr-body.md <<EOF
          Repoints \`HomebrewFormula/hkm.rb\` at the freshly published \`v$VERSION\` assets — the release URL, and the sha256 of the macOS tarball as actually downloaded from it.

          Opened automatically because a direct push to \`main\` was rejected: \`main\` requires pull requests. Until this merges, \`brew install hkm\` installs the previous release — or fails its checksum, on the very first release to carry the formula.

          Generated by the \`homebrew\` job in .github/workflows/release.yml.
          EOF

          if gh pr create --base main --head "$BRANCH" \
               --title "chore(homebrew): point the formula at v$VERSION" \
               --body-file pr-body.md; then
            exit 0
          fi

          # Opening a PR is a permission the repo can withhold from Actions —
          # "Allow GitHub Actions to create and approve pull requests", off by
          # default — and it fails at the API, after the branch is already
          # pushed. Failing the job here reported a release that HAD published
          # successfully as broken, which is the opposite of useful. The bump is
          # safe on the branch, so say how to finish it and exit clean.
          echo "::warning::Could not open the pull request automatically; the branch is pushed and ready."
          echo "::warning::Open it: https://github.com/$GITHUB_REPOSITORY/compare/main...$BRANCH?expand=1"
          echo "::warning::To automate this, either (a) enable Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests', or (b) let github-actions[bot] bypass branch protection on main, which skips the PR entirely."
